<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi Carrito — Cana'an Xu'x</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css">
<style>
  .carrito-wrap { max-width: 900px; margin: 40px auto; padding: 0 24px; }
  .carrito-titulo { font-family:'Playfair Display',serif; font-size:28px; color:var(--cafe); margin-bottom:28px; }
  .carrito-vacio { text-align:center; padding:60px 20px; color:var(--gris); }
  .carrito-vacio .icon { font-size:56px; margin-bottom:16px; }
  .carrito-vacio p { font-size:16px; margin-bottom:20px; }
  .carrito-tabla { width:100%; border-collapse:collapse; }
  .carrito-tabla th { text-align:left; padding:10px 14px; font-size:12px; font-weight:700; color:var(--gris); border-bottom:2px solid var(--borde); text-transform:uppercase; letter-spacing:.05em; }
  .carrito-tabla td { padding:16px 14px; border-bottom:1px solid var(--borde); vertical-align:middle; }
  .prod-thumb { width:64px; height:64px; object-fit:cover; border-radius:8px; background:var(--gris-claro); }
  .prod-nombre { font-weight:600; font-size:14px; color:var(--cafe); }
  .qty-ctrl { display:flex; align-items:center; gap:8px; }
  .qty-btn { width:28px; height:28px; border:1.5px solid var(--borde); border-radius:6px; background:#fff; cursor:pointer; font-size:16px; display:flex; align-items:center; justify-content:center; color:var(--cafe); }
  .qty-btn:hover { border-color:var(--naranja); color:var(--naranja); }
  .qty-num { font-weight:700; font-size:15px; min-width:20px; text-align:center; }
  .btn-eliminar { background:none; border:none; cursor:pointer; color:#ccc; font-size:18px; }
  .btn-eliminar:hover { color:#e74c3c; }
  .carrito-resumen { margin-top:32px; display:flex; justify-content:flex-end; }
  .resumen-card { background:var(--gris-claro); border-radius:12px; padding:28px; min-width:280px; }
  .resumen-row { display:flex; justify-content:space-between; font-size:14px; margin-bottom:10px; color:var(--gris); }
  .resumen-total { display:flex; justify-content:space-between; font-size:18px; font-weight:700; color:var(--cafe); margin-top:14px; padding-top:14px; border-top:2px solid var(--borde); }
  .btn-pagar { width:100%; background:var(--naranja); color:#fff; border:none; border-radius:8px; padding:14px; font-size:15px; font-weight:700; cursor:pointer; font-family:inherit; margin-top:16px; transition:background .2s; }
  .btn-pagar:hover { background:var(--naranja-oscuro); }

  /* CUPONES */
  .cupon-banner-wrap { margin: 20px 0; display: flex; flex-direction: column; gap: 10px; }
  .cupon-banner { background: linear-gradient(135deg, #fef8f2, #fdf0e0); border: 2px dashed var(--naranja); border-radius: 10px; padding: 14px 18px; display: flex; align-items: center; gap: 14px; cursor: pointer; transition: transform .15s; }
  .cupon-banner:hover { transform: translateY(-2px); }
  .cupon-banner .icon { font-size: 26px; }
  .cupon-banner .info { flex: 1; }
  .cupon-banner .codigo { font-weight: 800; color: var(--naranja); font-size: 14px; letter-spacing: 1px; }
  .cupon-banner .desc { font-size: 12px; color: var(--gris); margin-top: 2px; }
  .cupon-banner .usar-btn { background: var(--naranja); color: #fff; border: none; border-radius: 6px; padding: 7px 14px; font-size: 12px; font-weight: 700; cursor: pointer; flex-shrink: 0; }

  .campo-cupon { display: flex; gap: 8px; margin-bottom: 14px; }
  .campo-cupon input { flex: 1; padding: 10px 12px; border: 1.5px solid var(--borde); border-radius: 7px; font-size: 13px; font-family: inherit; outline: none; }
  .campo-cupon input:focus { border-color: var(--naranja); }
  .campo-cupon button { background: var(--cafe); color: #fff; border: none; border-radius: 7px; padding: 0 18px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .msg-cupon { font-size: 12px; margin-bottom: 10px; display: none; padding: 8px 12px; border-radius: 6px; }
  .msg-cupon.ok { background: #eafaf1; color: #1e8449; display: block; }
  .msg-cupon.error { background: #fdecea; color: #c0392b; display: block; }
  .loading { text-align:center; padding:40px; color:var(--gris); }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <a href="index.html" class="logo-wrap">
      <img class="logo-img" src="imagen/logo.png" alt="Cana'an Xu'x">
      <div class="logo-name">Cana´an Xu´x <span>Apicultoras Tenosiquenses</span></div>
    </a>
    <div class="header-icons">
      <a href="#" onclick="toggleSearch(); return false">
        <svg class="icon-svg" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>
        Buscar
      </a>
      <a href="login.html" id="btn-ingresar">
        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span id="txt-sesion">Ingresar</span>
      </a>
      <a href="carrito.html" id="cart-btn">
        <svg class="icon-svg" viewBox="0 0 24 24"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        Carrito <span class="cart-count-badge" id="cart-count">0</span>
      </a>
    </div>
  </div>
</header>

<div class="carrito-wrap">
  <h2 class="carrito-titulo">Mi Carrito</h2>
  <div id="carrito-contenido"><div class="loading">Cargando tu carrito...</div></div>
</div>

<div class="search-overlay">
  <div class="search-box">
    <button class="search-close">✕</button>
    <input type="text" placeholder="Buscar productos...">
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
<script>
let totalCarritoActual = 0;
let cuponAplicado = null; // {id, codigo, tipo_descuento, valor, monto_minimo}

// Cargar items del carrito desde Supabase
async function cargarCarrito() {
  const { data: session } = await db.auth.getSession();
  const usuario = session?.session?.user;
  if (!usuario) { window.location.href = 'login.html'; return; }

  const { data: items, error } = await db
    .from('carrito')
    .select(`cantidad, productos(id, nombre, precio, imagen_url, stock)`)
    .eq('usuario_id', usuario.id);

  const contenedor = document.getElementById('carrito-contenido');

  if (!items || items.length === 0) {
    contenedor.innerHTML = `
      <div class="carrito-vacio">
        <div class="icon">🛒</div>
        <p>Tu carrito está vacío</p>
        <a href="index.html" class="btn-link" style="background:var(--naranja);color:#fff;padding:12px 28px;border-radius:8px;font-weight:700;">Ver productos</a>
      </div>`;
    return;
  }

  let total = 0;
  let filas = items.map(item => {
    const p = item.productos;
    const subtotal = p.precio * item.cantidad;
    total += subtotal;
    return `
      <tr id="fila-${p.id}">
        <td><img class="prod-thumb" src="${p.imagen_url || ''}" alt="${p.nombre}" onerror="this.style.background='#f5f0e8'"></td>
        <td><div class="prod-nombre">${p.nombre}</div></td>
        <td>$${parseFloat(p.precio).toFixed(2)}</td>
        <td>
          <div class="qty-ctrl">
            <button class="qty-btn" onclick="cambiarCantidad('${p.id}', -1)">−</button>
            <span class="qty-num" id="qty-${p.id}">${item.cantidad}</span>
            <button class="qty-btn" onclick="cambiarCantidad('${p.id}', 1)">+</button>
          </div>
        </td>
        <td>$${subtotal.toFixed(2)}</td>
        <td><button class="btn-eliminar" onclick="eliminarItem('${p.id}')" title="Eliminar">🗑</button></td>
      </tr>`;
  }).join('');

  totalCarritoActual = total;

  contenedor.innerHTML = `
    <table class="carrito-tabla">
      <thead><tr>
        <th></th><th>Producto</th><th>Precio</th><th>Cantidad</th><th>Subtotal</th><th></th>
      </tr></thead>
      <tbody>${filas}</tbody>
    </table>

    <div class="cupon-banner-wrap" id="cupon-banner-wrap"></div>

    <div class="carrito-resumen">
      <div class="resumen-card">
        <div class="campo-cupon">
          <input type="text" id="input-cupon" placeholder="Código de cupón" style="text-transform:uppercase" oninput="this.value=this.value.toUpperCase()">
          <button onclick="aplicarCupon()" id="btn-aplicar-cupon">Aplicar</button>
        </div>
        <div class="msg-cupon" id="msg-cupon"></div>

        <div class="resumen-row"><span>Subtotal</span><span id="txt-subtotal">$${total.toFixed(2)}</span></div>
        <div class="resumen-row" id="row-descuento" style="display:none;color:#1e8449"><span>Descuento <span id="cupon-aplicado-txt"></span></span><span id="txt-descuento">-$0.00</span></div>
        <div class="resumen-row"><span>Envío</span><span>Por calcular</span></div>
        <div class="resumen-total"><span>Total</span><span id="txt-total">$${total.toFixed(2)}</span></div>
        <button class="btn-pagar" onclick="procesarPedido()">Proceder al pago</button>
      </div>
    </div>`;

  cargarCuponesDisponibles();
}

async function cambiarCantidad(productoId, delta) {
  const { data: s } = await db.auth.getSession();
  const uid = s?.session?.user?.id;
  const qtyEl = document.getElementById('qty-' + productoId);
  const nuevaCantidad = parseInt(qtyEl.textContent) + delta;

  if (nuevaCantidad <= 0) { eliminarItem(productoId); return; }

  await db.from('carrito')
    .update({ cantidad: nuevaCantidad })
    .eq('usuario_id', uid)
    .eq('producto_id', productoId);

  cargarCarrito();
}

async function eliminarItem(productoId) {
  const { data: s } = await db.auth.getSession();
  const uid = s?.session?.user?.id;
  await db.from('carrito').delete().eq('usuario_id', uid).eq('producto_id', productoId);
  cargarCarrito();
  actualizarBadgeCarrito();
}

// ─── CUPONES ───
async function cargarCuponesDisponibles() {
  const wrap = document.getElementById('cupon-banner-wrap');
  if (!wrap) return;

  const { data: s } = await db.auth.getSession();
  const miCorreo = (s?.session?.user?.email || '').toLowerCase();

  const { data } = await db.from('cupones')
    .select('*')
    .eq('activo', true)
    .eq('visible_publico', true)
    .order('creado_en', { ascending: false });

  const hoy = new Date();
  const vigentes = (data || []).filter(c => {
    if (c.fecha_expira && new Date(c.fecha_expira) < hoy) return false;
    if (c.usos_maximos && c.usos_actuales >= c.usos_maximos) return false;
    // Si el cupón es exclusivo para un correo, solo mostrarlo a ese usuario
    if (c.destinatario_email && c.destinatario_email.toLowerCase() !== miCorreo) return false;
    return true;
  });

  if (!vigentes.length) { wrap.innerHTML = ''; return; }

  wrap.innerHTML = vigentes.map(c => {
    const valorTxt = c.tipo_descuento === 'porcentaje' ? c.valor + '% de descuento' : '$' + parseFloat(c.valor).toFixed(2) + ' de descuento';
    return `
      <div class="cupon-banner" onclick="document.getElementById('input-cupon').value='${c.codigo}'; aplicarCupon();">
        <span class="icon">🎟️</span>
        <div class="info">
          <div class="codigo">${c.codigo} — ${valorTxt}</div>
          <div class="desc">${c.titulo}${c.monto_minimo > 0 ? ' · Compra mínima $' + c.monto_minimo : ''}</div>
        </div>
        <button class="usar-btn">Usar</button>
      </div>`;
  }).join('');
}

async function aplicarCupon() {
  const codigo = document.getElementById('input-cupon').value.trim().toUpperCase();
  const msg = document.getElementById('msg-cupon');
  msg.className = 'msg-cupon';
  if (!codigo) return;

  const { data: cupon } = await db.from('cupones')
    .select('*').eq('codigo', codigo).eq('activo', true).single();

  if (!cupon) {
    msg.className = 'msg-cupon error'; msg.textContent = 'Cupón no válido.';
    cuponAplicado = null; actualizarResumenConCupon();
    return;
  }

  // Verificar que el cupón no sea exclusivo de otro usuario
  const { data: sCheck } = await db.auth.getSession();
  const miCorreoCheck = (sCheck?.session?.user?.email || '').toLowerCase();
  if (cupon.destinatario_email && cupon.destinatario_email.toLowerCase() !== miCorreoCheck) {
    msg.className = 'msg-cupon error'; msg.textContent = 'Este cupón es exclusivo para otro usuario.';
    cuponAplicado = null; actualizarResumenConCupon();
    return;
  }

  const hoy = new Date();
  if (cupon.fecha_expira && new Date(cupon.fecha_expira) < hoy) {
    msg.className = 'msg-cupon error'; msg.textContent = 'Este cupón ya expiró.';
    cuponAplicado = null; actualizarResumenConCupon();
    return;
  }
  if (cupon.usos_maximos && cupon.usos_actuales >= cupon.usos_maximos) {
    msg.className = 'msg-cupon error'; msg.textContent = 'Este cupón ya alcanzó su límite de usos.';
    cuponAplicado = null; actualizarResumenConCupon();
    return;
  }
  if (cupon.monto_minimo && totalCarritoActual < cupon.monto_minimo) {
    msg.className = 'msg-cupon error';
    msg.textContent = `Este cupón requiere una compra mínima de $${cupon.monto_minimo.toFixed(2)}.`;
    cuponAplicado = null; actualizarResumenConCupon();
    return;
  }

  // Verificar que el usuario no lo haya usado ya
  const { data: s } = await db.auth.getSession();
  const uid = s?.session?.user?.id;
  const { data: usoPrevio } = await db.from('cupones_usos')
    .select('id').eq('cupon_id', cupon.id).eq('usuario_id', uid).maybeSingle();

  if (usoPrevio) {
    msg.className = 'msg-cupon error'; msg.textContent = 'Ya usaste este cupón anteriormente.';
    cuponAplicado = null; actualizarResumenConCupon();
    return;
  }

  cuponAplicado = cupon;
  msg.className = 'msg-cupon ok'; msg.textContent = `✓ Cupón "${cupon.codigo}" aplicado.`;
  actualizarResumenConCupon();
}

function actualizarResumenConCupon() {
  const rowDescuento = document.getElementById('row-descuento');
  const txtDescuento = document.getElementById('txt-descuento');
  const txtTotal = document.getElementById('txt-total');
  const cuponTxt = document.getElementById('cupon-aplicado-txt');

  if (!cuponAplicado) {
    rowDescuento.style.display = 'none';
    txtTotal.textContent = '$' + totalCarritoActual.toFixed(2);
    return;
  }

  let descuento = cuponAplicado.tipo_descuento === 'porcentaje'
    ? totalCarritoActual * (cuponAplicado.valor / 100)
    : cuponAplicado.valor;
  descuento = Math.min(descuento, totalCarritoActual);

  const totalFinal = totalCarritoActual - descuento;

  rowDescuento.style.display = 'flex';
  cuponTxt.textContent = '(' + cuponAplicado.codigo + ')';
  txtDescuento.textContent = '-$' + descuento.toFixed(2);
  txtTotal.textContent = '$' + totalFinal.toFixed(2);
}

// ─── PROCESAR PEDIDO: descuenta stock automáticamente ───
async function procesarPedido() {
  const { data: s } = await db.auth.getSession();
  const usuario = s?.session?.user;
  if (!usuario) { window.location.href = 'login.html'; return; }

  const btn = document.querySelector('.btn-pagar');
  btn.disabled = true; btn.textContent = 'Procesando...';

  const { data: items } = await db
    .from('carrito')
    .select(`cantidad, productos(id, nombre, precio, stock)`)
    .eq('usuario_id', usuario.id);

  if (!items || !items.length) { btn.disabled = false; btn.textContent = 'Proceder al pago'; return; }

  // Verificar que haya suficiente stock antes de procesar
  for (const item of items) {
    if (item.cantidad > item.productos.stock) {
      alert(`Lo sentimos, solo quedan ${item.productos.stock} unidades de "${item.productos.nombre}".`);
      btn.disabled = false; btn.textContent = 'Proceder al pago';
      return;
    }
  }

  const total = items.reduce((s, i) => s + (i.productos.precio * i.cantidad), 0);

  // Aplicar descuento de cupón si hay uno válido
  let descuento = 0;
  if (cuponAplicado) {
    descuento = cuponAplicado.tipo_descuento === 'porcentaje'
      ? total * (cuponAplicado.valor / 100)
      : cuponAplicado.valor;
    descuento = Math.min(descuento, total);
  }
  const totalFinal = total - descuento;

  // Crear el pedido
  const { data: pedido, error: errPedido } = await db.from('pedidos').insert({
    usuario_id: usuario.id, total: totalFinal, estado: 'pagado'
  }).select().single();

  if (errPedido) {
    alert('Hubo un error al procesar tu pedido. Intenta de nuevo.');
    btn.disabled = false; btn.textContent = 'Proceder al pago';
    return;
  }

  // Registrar el uso del cupón
  if (cuponAplicado) {
    await db.from('cupones_usos').insert({
      cupon_id: cuponAplicado.id, usuario_id: usuario.id, pedido_id: pedido.id
    });
    await db.from('cupones').update({ usos_actuales: (cuponAplicado.usos_actuales || 0) + 1 }).eq('id', cuponAplicado.id);
  }

  // Crear items del pedido + descontar stock + registrar movimiento
  for (const item of items) {
    const p = item.productos;
    const nuevoStock = p.stock - item.cantidad;

    await db.from('pedido_items').insert({
      pedido_id: pedido.id, producto_id: p.id, cantidad: item.cantidad, precio_unit: p.precio
    });

    // Descontar stock — si llega a 0 el producto se marca agotado automáticamente
    // porque la tienda ya verifica stock <= 0 para mostrar "Agotado"
    await db.from('productos').update({ stock: nuevoStock }).eq('id', p.id);

    // Registrar el movimiento en el historial de inventario
    await db.from('inventario_movimientos').insert({
      producto_id: p.id, tipo: 'venta', cantidad: -item.cantidad,
      stock_resultante: nuevoStock, nota: `Pedido #${pedido.id.slice(0,8)}`
    });
  }

  // Vaciar el carrito
  await db.from('carrito').delete().eq('usuario_id', usuario.id);

  btn.textContent = '✓ ¡Pedido realizado!';
  btn.style.background = '#4caf50';
  await actualizarBadgeCarrito();

  setTimeout(() => {
    document.getElementById('carrito-contenido').innerHTML = `
      <div class="carrito-vacio">
        <div class="icon">✅</div>
        <p>¡Gracias por tu compra! Tu pedido fue registrado correctamente.</p>
        <a href="index.html" class="btn-link" style="background:var(--naranja);color:#fff;padding:12px 28px;border-radius:8px;font-weight:700;">Seguir comprando</a>
      </div>`;
  }, 1200);
}

document.addEventListener('DOMContentLoaded', cargarCarrito);
</script>
</body>
</html>
